[tool.poetry]
name = "telegram-mini-app"
version = "0.1.0"
description = "A Telegram Mini App with Python backend"
authors = ["Your Name"]
readme = "README.md"
packages = [{include = "telegram_mini_app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
flask = "^3.1.0"
pymongo = "^4.12.0"
python-dotenv = "^1.1.0"
flask-cors = "^5.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 