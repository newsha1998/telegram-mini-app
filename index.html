<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .user-info {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: block;
            border: 3px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>Hello, <span id="username">there</span>!</h1>
        <div class="user-info">
            <img id="user-avatar" class="avatar" src="" alt="User Avatar">
            <p>Welcome to your personalized Telegram Mini App!</p>
        </div>
    </div>

    <script>
        // Initialize the Telegram WebApp
        const webApp = window.Telegram.WebApp;
        
        // Expand the app to full height
        webApp.expand();
        
        // Get user data
        const user = webApp.initDataUnsafe.user;
        
        // Update the UI with user information
        document.getElementById('username').textContent = user?.first_name || 'there';
        
        // Set user avatar if available
        const avatarElement = document.getElementById('user-avatar');
        if (user?.photo_url) {
            avatarElement.src = user.photo_url;
        } else {
            avatarElement.style.display = 'none';
        }
    </script>
</body>
</html>
