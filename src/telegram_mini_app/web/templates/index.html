<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .emoji {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: wave 2s infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        .user-info {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: block;
            border: 3px solid white;
            object-fit: cover;
        }

        .request-button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 1rem;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .request-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>Hello, <span id="username">there</span>!</h1>
        <div class="user-info">
            <img id="user-avatar" class="avatar" src="" alt="User Avatar">
            <p>Welcome to your personalized Telegram Mini App!</p>
            <button id="request-photo" class="request-button">Show my profile picture</button>
            <div id="user-data" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script>
        // Initialize the Telegram WebApp
        const webApp = window.Telegram.WebApp;
        
        // Expand the app to full height
        webApp.expand();
        
        // Get user data
        const user = webApp.initDataUnsafe.user;
        
        // Update the UI with user information
        document.getElementById('username').textContent = user?.first_name || 'there';
        
        // Handle profile picture
        const avatarElement = document.getElementById('user-avatar');
        const requestButton = document.getElementById('request-photo');
        const userDataElement = document.getElementById('user-data');

        async function saveUserData() {
            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        id: user.id,
                        first_name: user.first_name,
                        last_name: user.last_name,
                        username: user.username,
                        photo_url: user.photo_url
                    })
                });
                const data = await response.json();
                console.log('User data saved:', data);
            } catch (error) {
                console.error('Error saving user data:', error);
            }
        }

        async function loadUserData() {
            try {
                const response = await fetch(`/api/users?telegramId=${user.id}`);
                const data = await response.json();
                if (data.last_seen) {
                    userDataElement.innerHTML = `Last seen: ${new Date(data.last_seen).toLocaleString()}`;
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }
        }

        function updateAvatar() {
            if (user?.photo_url) {
                avatarElement.src = user.photo_url;
                requestButton.style.display = 'none';
            } else {
                avatarElement.style.display = 'none';
                requestButton.style.display = 'block';
            }
        }

        // Initial check
        updateAvatar();
        saveUserData();
        loadUserData();

        // Handle photo request button click
        requestButton.addEventListener('click', () => {
            webApp.requestWriteAccess().then(() => {
                // After getting write access, the photo_url should be available
                const updatedUser = webApp.initDataUnsafe.user;
                if (updatedUser?.photo_url) {
                    avatarElement.style.display = 'block';
                    avatarElement.src = updatedUser.photo_url;
                    requestButton.style.display = 'none';
                    saveUserData(); // Save updated user data
                }
            }).catch(() => {
                // Handle the case when user denies access
                alert('Please grant access to show your profile picture');
            });
        });
    </script>
</body>
</html>
