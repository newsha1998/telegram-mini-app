<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>Hello, <span id="username">there</span>!</h1>
        <div class="user-info">
            <img id="user-avatar" class="avatar" src="" alt="User Avatar">
            <p>Welcome to your personalized Telegram Mini App!</p>
            <button id="request-photo" class="request-button">Show my profile picture</button>
            <div id="user-data" style="margin-top: 1rem;"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
